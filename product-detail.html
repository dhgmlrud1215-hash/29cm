<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모듈 디퓨저 | 29CM</title>
</head>
<body>
    <header>
        <!-- 29CM 헤더 -->
    </header>

    <main class="product-detail">
    <section class="brand-banner">
        <div class="brand-info">
            <img
                src="./img_detail/brand-logo.webp"
                alt="이구어포스트로피 로고"
                class="brand-logo"
            >

            <div class="brand-text">
                <h2>이구어포스트로피</h2>
                <p>아름다운 실용</p>
            </div>
        </div>

        <a href="#" class="brand-home">BRAND HOME</a>
    </section>

    <section class="product-top">
        <div class="product-gallery">
            <div class="product-main-image">
                <img
                    src="./img_detail/diffuser-main.webp"
                    alt="이구어포스트로피 모듈 디퓨저"
                    id="mainProductImage"
                >
            </div>

            <div class="product-thumbnails">
                <button type="button" class="thumbnail active">
                    <img
                        src="./img_detail/diffuser-main.webp"
                        alt="모듈 디퓨저 대표 이미지"
                    >
                </button>

                <button type="button" class="thumbnail">
                    <img
                        src="./img_detail/diffuser-sub1.webp"
                        alt="모듈 디퓨저 색상 구성"
                    >
                </button>

                <button type="button" class="thumbnail">
                    <img
                        src="./img_detail/diffuser-sub2.webp"
                        alt="모듈 디퓨저 연출 이미지 1"
                    >
                </button>

                <button type="button" class="thumbnail">
                    <img
                        src="./img_detail/diffuser-sub3.webp"
                        alt="모듈 디퓨저 연출 이미지 2"
                    >
                </button>

                <button type="button" class="thumbnail">
                    <img
                        src="./img_detail/diffuser-sub4.webp"
                        alt="모듈 디퓨저 연출 이미지 3"
                    >
                </button>
            </div>
        </div>

        <div class="product-summary">
            <!-- 상품명, 가격, 옵션, 구매 버튼 -->
        </div>
    </section>
</main>
</body>
</html>
